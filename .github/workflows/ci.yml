name: Python source and synthetic QC
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy duckdb pytest scikit-learn rasterio pyarrow
      - name: Syntax-check tracked Python
        run: python -m compileall -q .
      - name: Run data-free synthetic tests
        run: python -m pytest -q tests
      - name: Registry can be inspected without data
        run: python tools/verify_project.py --manifest-only
